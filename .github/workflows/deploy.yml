name: Deploy MentorEval Leaderboard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Build and prepare deployment
      run: |
        # Build the webpage
        cd webpage
        python build.py
        echo "Files in webpage directory after build:"
        ls -la
        echo "Checking script.js content:"
        head -20 script.js
        
        # Create deployment directory
        cd ..
        mkdir -p deploy
        
        # Copy webpage files to deploy directory
        cp webpage/index.html deploy/
        cp webpage/style.css deploy/
        
        # Debug: Check what paths are in the original script.js
        echo "Checking original script.js paths:"
        grep -n "fetch.*results" webpage/script.js || echo "No results fetch found"
        grep -n "fetch.*runs" webpage/script.js || echo "No runs fetch found"
        
        # Fix paths in script.js for deployment (remove ../ prefixes)
        echo "Running sed to fix paths..."
        sed 's|../results/|results/|g; s|../runs/|runs/|g' webpage/script.js > deploy/script.js
        
        # Debug: Check what paths are in the fixed script.js
        echo "Checking fixed script.js paths:"
        grep -n "fetch.*results" deploy/script.js || echo "No results fetch found"
        grep -n "fetch.*runs" deploy/script.js || echo "No runs fetch found"
        
        cp -r webpage/assets deploy/
        
        # Copy data directories
        cp -r results deploy/
        cp -r runs deploy/
        
        # Verify deployment structure
        echo "Deployment structure:"
        ls -la deploy/
        echo "Results directory:"
        ls -la deploy/results/
        echo "Runs directory:"
        ls -la deploy/runs/
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
        publish_dir: ./deploy