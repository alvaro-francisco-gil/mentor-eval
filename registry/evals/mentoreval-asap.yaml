# Test ASAP Evaluation (limited samples)
mentoreval-asap-ex1-test:  
  id: mentoreval-asap-ex1-test.dev.v0  
  metrics: [accuracy]  
  description: Test eval for ASAP exercise set 1 with only 3 samples  
mentoreval-asap-ex1-test.dev.v0:  
  class: evals.elsuite.basic.match:Match  
  args:  
    samples_jsonl: mentoreval/asap/exercise_set_1/test.jsonl  
    few_shot_jsonl: mentoreval/asap/exercise_set_1/train.jsonl  
    num_few_shot: -1  
    max_samples: 3  # This limits to only 3 test samples

